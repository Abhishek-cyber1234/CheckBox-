<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study 5-Step Tracker</title>

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:linear-gradient(135deg,#f6f8ff,#eef7ff);
    color:#172033;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .app{
    width:min(760px,100%);
    background:#fff;
    border-radius:22px;
    box-shadow:0 18px 50px rgba(31,51,92,.12);
    padding:28px
  }

  h1{
    margin:0 0 8px;
    font-size:30px
  }

  .sub{
    margin:0 0 24px;
    color:#667085
  }

  .form{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
    margin-bottom:22px
  }

  input,select,button{
    border:1px solid #d9dee8;
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
  }

  input:focus,select:focus{
    outline:2px solid #b9c8ff;
    border-color:#8297ff
  }

  button{
    cursor:pointer;
    font-weight:700;
    background:#172033;
    color:#fff;
    border:none
  }

  button:disabled{
    cursor:not-allowed;
    opacity:.45
  }

  .card{
    border:1px solid #e5e8ef;
    border-radius:18px;
    padding:20px
  }

  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px
  }

  .badge{
    display:inline-block;
    background:#eef2ff;
    color:#4055c8;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:800
  }

  h2{
    margin:8px 0 4px;
    font-size:24px
  }

  .subject{
    color:#667085
  }

  .progress-wrap{
    margin:18px 0
  }

  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:8px;
    color:#667085
  }

  .bar{
    height:10px;
    background:#edf0f5;
    border-radius:999px;
    overflow:hidden
  }

  .fill{
    height:100%;
    width:0;
    background:#4b63d3;
    transition:width .25s
  }

  .checks{
    display:flex;
    flex-direction:column;
    gap:11px
  }

  label.check{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 13px;
    border:1px solid #e9ebf0;
    border-radius:12px;
    background:#fafbfc;
    cursor:pointer
  }

  label.check input{
    margin-top:3px;
    transform:scale(1.15)
  }

  label.check span{
    line-height:1.4
  }

  .done{
    background:#effaf3!important;
    border-color:#bde7c9!important
  }

  .complete{
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:#ecfdf3;
    color:#1f7a46;
    font-weight:700
  }

  .hidden{
    display:none
  }

  .small{
    font-size:13px;
    color:#667085
  }

  .history{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid #eceff3
  }

  .history h3{
    margin:0 0 10px
  }

  .item{
    display:flex;
    justify-content:space-between;
    padding:10px 12px;
    background:#f8f9fb;
    border-radius:10px;
    margin:7px 0
  }

  @media(max-width:700px){
    .form{
      grid-template-columns:1fr
    }

    .app{
      padding:20px
    }
  }
</style>
</head>

<body>

<div class="app">

  <h1>Study 5-Step Tracker</h1>

  <p class="sub">
    Ek lecture/chapter ko tabhi complete mano jab 5/5 steps tick ho jaayen.
  </p>

  <!-- INPUT VIEW -->
  <div id="inputView">

    <div class="form">

      <select id="subject">
        <option value="">Subject select karo</option>
        <option>Data Structures</option>
        <option>Discrete Mathematics</option>
        <option>Digital Electronics</option>
      </select>

      <input
        id="chapter"
        placeholder="Chapter / Lecture name"
      />

      <button id="startBtn">
        Start
      </button>

    </div>

    <p class="small">
      Subject ke hisaab se fixed 5-step workflow automatically aayega.
    </p>

  </div>


  <!-- TRACKER VIEW -->
  <div id="trackerView" class="hidden">

    <div class="card">

      <div class="top">

        <div>

          <span class="badge" id="badge"></span>

          <h2 id="title"></h2>

          <div class="subject" id="subj"></div>

        </div>

        <button id="newBtn" disabled>
          New Topic
        </button>

      </div>


      <!-- PROGRESS -->
      <div class="progress-wrap">

        <div class="progress-label">

          <span>Progress</span>

          <span id="count">
            0/5
          </span>

        </div>

        <div class="bar">

          <div
            class="fill"
            id="fill"
          ></div>

        </div>

      </div>


      <!-- CHECKBOXES -->
      <div
        class="checks"
        id="checks"
      ></div>


      <!-- COMPLETE MESSAGE -->
      <div
        id="completeMsg"
        class="complete hidden"
      >
        🎉 5/5 complete! Ab next chapter/lecture enter karo.
      </div>

    </div>


    <!-- HISTORY -->
    <div class="history">

      <h3>
        Completed Topics
      </h3>

      <div id="historyList">

        <div class="small">
          Abhi kuch complete nahi hua.
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   FIXED WORKFLOWS
===================================================== */

const workflows = {

  "Data Structures": [
    "GPT — Preview + Topics",
    "NPTEL — Lecture",
    "GPT + GFG — Doubt / Gap Fill",
    "Practice — Code / Questions",
    "Obsidian — Final Notes"
  ],

  "Discrete Mathematics": [
    "GPT — Preview + Topics",
    "NPTEL — Lecture",
    "GPT — Doubt Clearing",
    "Practice — Questions",
    "Obsidian — Final Notes"
  ],

  "Digital Electronics": [
    "GPT — Preview + Topics",
    "NPTEL — Lecture",
    "GPT — Doubt Clearing",
    "Practice — Problems / PYQs",
    "Obsidian — Final Notes"
  ]

};


/* =====================================================
   DOM ELEMENTS
===================================================== */

const subject =
  document.getElementById("subject");

const chapter =
  document.getElementById("chapter");

const startBtn =
  document.getElementById("startBtn");

const newBtn =
  document.getElementById("newBtn");

const inputView =
  document.getElementById("inputView");

const trackerView =
  document.getElementById("trackerView");

const badge =
  document.getElementById("badge");

const title =
  document.getElementById("title");

const subj =
  document.getElementById("subj");

const checks =
  document.getElementById("checks");

const count =
  document.getElementById("count");

const fill =
  document.getElementById("fill");

const completeMsg =
  document.getElementById("completeMsg");

const historyList =
  document.getElementById("historyList");


/* =====================================================
   LOAD SAVED DATA
===================================================== */

/*
  Current topic ko localStorage se load kar rahe hain.

  Agar reload hua:
  current topic + checkbox states restore ho jayenge.
*/

let current =
  JSON.parse(
    localStorage.getItem("studyCurrent") || "null"
  );


/*
  Completed topics ki history load kar rahe hain.
*/

let completed =
  JSON.parse(
    localStorage.getItem("studyCompleted") || "[]"
  );


/* =====================================================
   SAVE CURRENT TOPIC
===================================================== */

function saveCurrent(){

  if(current){

    localStorage.setItem(
      "studyCurrent",
      JSON.stringify(current)
    );

  }

}


/* =====================================================
   REMOVE CURRENT TOPIC
===================================================== */

function clearCurrent(){

  current = null;

  localStorage.removeItem(
    "studyCurrent"
  );

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  if(!completed.length){

    historyList.innerHTML =
      '<div class="small">Abhi kuch complete nahi hua.</div>';

    return;

  }


  historyList.innerHTML =
    completed
      .slice()
      .reverse()
      .map(x => `

        <div class="item">

          <span>

            <strong>
              ${escapeHtml(x.chapter)}
            </strong>

            <br>

            <span class="small">
              ${escapeHtml(x.subject)}
            </span>

          </span>

          <span class="small">
            ${x.date}
          </span>

        </div>

      `)
      .join("");

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(s){

  return s.replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])

  );

}


/* =====================================================
   GET BADGE
===================================================== */

function getBadge(s){

  if(s === "Data Structures")
    return "DS";

  if(s === "Discrete Mathematics")
    return "DM";

  if(s === "Digital Electronics")
    return "DE";

  return "";

}


/* =====================================================
   RENDER CURRENT TOPIC
===================================================== */

function renderCurrentTopic(){

  if(!current){

    inputView.classList.remove("hidden");

    trackerView.classList.add("hidden");

    return;

  }


  /*
    Input view hide
  */

  inputView.classList.add("hidden");

  trackerView.classList.remove("hidden");


  /*
    Topic information
  */

  badge.textContent =
    getBadge(current.subject);

  title.textContent =
    current.chapter;

  subj.textContent =
    current.subject;


  /*
    Checkbox HTML create
  */

  checks.innerHTML =
    workflows[current.subject]
      .map((step,i) => `

        <label
          class="check"
          id="row${i}"
        >

          <input
            type="checkbox"
            data-i="${i}"
            ${current.checked[i] ? "checked" : ""}
          >

          <span>
            ${i+1}. ${step}
          </span>

        </label>

      `)
      .join("");


  /*
    Checkbox event listeners
  */

  checks
    .querySelectorAll("input")
    .forEach(box => {

      box.addEventListener(
        "change",
        updateProgress
      );

    });


  /*
    Current progress update
  */

  updateProgress(false);

}


/* =====================================================
   START NEW TOPIC
===================================================== */

function startTopic(){

  const s =
    subject.value.trim();

  const c =
    chapter.value.trim();


  if(!s || !c){

    alert(
      "Subject aur chapter/lecture name dono bharo."
    );

    return;

  }


  /*
    New current topic
  */

  current = {

    subject:s,

    chapter:c,

    checked:Array(5).fill(false)

  };


  /*
    Save immediately.

    Ab user Start karte hi data save ho jayega.
  */

  saveCurrent();


  /*
    Render
  */

  renderCurrentTopic();


  /*
    Scroll top
  */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function updateProgress(save = true){

  if(!current)
    return;


  const boxes =
    [
      ...checks.querySelectorAll("input")
    ];


  /*
    Checkbox states read
  */

  current.checked =
    boxes.map(
      b => b.checked
    );


  /*
    Count
  */

  const done =
    current.checked
      .filter(Boolean)
      .length;


  /*
    Progress text
  */

  count.textContent =
    `${done}/5`;


  /*
    Progress bar
  */

  fill.style.width =
    `${done * 20}%`;


  /*
    Green completed checkbox
  */

  boxes.forEach((b,i) => {

    const row =
      document.getElementById(
        `row${i}`
      );

    row.classList.toggle(
      "done",
      b.checked
    );

  });


  /*
    IMPORTANT:
    Current progress localStorage mein save karo.
  */

  if(save){

    saveCurrent();

  }


  /*
    5/5 complete
  */

  if(done === 5){

    newBtn.disabled = false;

    completeMsg.classList.remove(
      "hidden"
    );


    /*
      History mein duplicate add nahi hoga.
    */

    if(
      !completed.some(
        x =>
          x.subject === current.subject &&
          x.chapter === current.chapter
      )
    ){

      completed.push({

        subject:current.subject,

        chapter:current.chapter,

        date:new Date()
          .toLocaleDateString("en-IN")

      });


      localStorage.setItem(
        "studyCompleted",
        JSON.stringify(completed)
      );


      renderHistory();

    }

  }

  else{

    newBtn.disabled = true;

    completeMsg.classList.add(
      "hidden"
    );

  }

}


/* =====================================================
   NEW TOPIC BUTTON
===================================================== */

newBtn.addEventListener(
  "click",
  () => {

    /*
      Current topic clear karo.
    */

    clearCurrent();


    /*
      Input screen show karo.
    */

    inputView.classList.remove(
      "hidden"
    );

    trackerView.classList.add(
      "hidden"
    );


    /*
      Inputs reset
    */

    subject.value = "";

    chapter.value = "";

    chapter.focus();

  }
);


/* =====================================================
   START BUTTON
===================================================== */

startBtn.addEventListener(
  "click",
  startTopic
);


/* =====================================================
   ENTER KEY
===================================================== */

chapter.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){

      startTopic();

    }

  }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

/*
  Page reload hone par:

  1. localStorage se current topic load
  2. checkbox states restore
  3. progress restore
  4. completed history restore
*/

renderHistory();

renderCurrentTopic();

</script>

</body>
</html>
